[package]
name = "mc-core"
version = "0.1.0"
edition = "2021"
description = "Minecraft 客户端安装核心：版本元数据、下载、加载器、Java"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time", "process"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "gzip"] }
futures = "0.3"
sha1 = "0.10"
hex = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
dirs = "6"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[[bin]]
name = "mcinst"
path = "src/bin/mcinst.rs"
